[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assay-disagreement"
version = "0.1.0"
description = "Reproducible ChEMBL assay-disagreement benchmark pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "requests>=2.31",
  "rdkit>=2023.9",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pyarrow>=14.0",
  "xgboost>=2.0,<4",
  "matplotlib>=3.8,<4",
  "torch>=2.4,<2.5",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
protein = ["torch>=2.4,<2.5", "fair-esm==2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
